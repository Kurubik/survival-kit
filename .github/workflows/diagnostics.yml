name: Previous emulator diagnostics
on:
  push:
    paths: [.github/workflows/diagnostics.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report previous emulator failure without credential disclosure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import subprocess,re,pathlib,xml.etree.ElementTree as ET
          result=subprocess.run(['gh','run','view','44088784154','--log-failed'],capture_output=True,text=True)
          if result.returncode:
              print(result.stderr)
              raise SystemExit(result.returncode)
          downloaded=subprocess.run(['gh','run','download','44088784154','--name','putnik-android-alpha','--dir','prior-evidence'],capture_output=True,text=True)
          extra=[]
          if downloaded.returncode==0:
              native=pathlib.Path('prior-evidence/evidence/native-logcat.txt')
              if native.exists():
                  extra.extend(native.read_text().splitlines()[-120:])
              for report in pathlib.Path('prior-evidence').rglob('TEST-*.xml'):
                  try:
                      for failure in ET.parse(report).getroot().iter('failure'):
                          extra.append('Native test XML '+failure.get('message','')+' '+(failure.text or '')[:2500])
                  except ET.ParseError:pass
          else:extra.append('Native artifact download not available')
          lines=result.stdout.splitlines()+extra
          indices=set()
          for i,line in enumerate(lines):
              if re.search(r'PutnikAI|llama_context|llama_init|llama_model_load|Native chat|Native test XML|freeConversationUses|Builder RAM|Disk free|failed|error loading',line,re.I):
                  indices.update(range(max(0,i-3),min(len(lines),i+4)))
          selected=[lines[i] for i in sorted(indices)]
          for index in range(0,len(selected),30):
              message='\n'.join(selected[index:index+30])[:12000]
              message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Previous emulator log::'+message)
          PY
