name: Android alpha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned toolchain
        run: 'python3 tools/ci-run.py "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Compile and verify
        run: python3 tools/ci-run.py ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleAndroidTest --stacktrace
      - name: Download verified offline Latvia fixture
        run: |
          curl -fL --retry 2 https://download.mapsforge.org/maps/v5/europe/latvia.map -o /tmp/latvia.map
          echo '72c93a1527458ab589accba21f85cdd8a529381a7c549346701ef3efbf756b2d  /tmp/latvia.map' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android emulator UI and offline map checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb push /tmp/latvia.map /data/local/tmp/latvia.map
            adb shell run-as lv.putnik.survivalkit mkdir -p files/packs
            adb shell 'cat /data/local/tmp/latvia.map | run-as lv.putnik.survivalkit sh -c "cat > files/packs/latvia.map"'
            adb shell svc wifi disable
            adb shell svc data disable
            python3 tools/ci-run.py ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/lv.putnik.survivalkit/files/screenshots evidence
      - name: Save alpha and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: putnik-android-alpha
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            evidence/
          retention-days: 30
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: putnik-android-alpha
          path: output
      - name: Publish reviewed alpha artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp output/app/build/outputs/apk/debug/app-debug.apk release/putnik-alpha.apk
          (cd release && sha256sum putnik-alpha.apk > SHA256SUMS)
          if [ -d output/evidence ]; then (cd output/evidence && zip -r ../../release/android-emulator-screenshots.zip .); fi
          gh release create "alpha-${{ github.run_number }}" release/* --prerelease --target "$GITHUB_SHA" --title "Путник · Android alpha ${{ github.run_number }}" --notes-file docs/ALPHA.md
