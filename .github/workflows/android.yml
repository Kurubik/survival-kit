name: Android alpha
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/ci-android-home
      ANDROID_EMULATOR_HOME: ${{ github.workspace }}/ci-android-home
      ANDROID_AVD_HOME: ${{ github.workspace }}/ci-android-home/avd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned toolchain
        run: 'python3 tools/ci-run.py "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Compile and verify
        run: python3 tools/ci-run.py ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleAndroidTest --stacktrace
      - name: Download verified offline Latvia fixture
        run: |
          curl -fL --retry 2 https://download.mapsforge.org/maps/v5/europe/latvia.map -o /tmp/latvia.map
          echo '72c93a1527458ab589accba21f85cdd8a529381a7c549346701ef3efbf756b2d  /tmp/latvia.map' | sha256sum -c -
      - uses: actions/cache@v4
        with:
          path: /tmp/putnik-qwen3-4b.gguf
          key: qwen3-4b-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
      - name: Download and verify actual local AI fixture
        run: |
          if [ ! -f /tmp/putnik-qwen3-4b.gguf ]; then
            curl -fL --retry 2 --connect-timeout 20 --max-time 600 'https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf' -o /tmp/putnik-qwen3-4b.gguf
          fi
          echo '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5  /tmp/putnik-qwen3-4b.gguf' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android UI, offline map and native conversation checks
        run: python3 tools/ci-run.py python3 tools/emulator-check.py
      - name: Save alpha and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: putnik-android-alpha
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            evidence/
          retention-days: 30
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: putnik-android-alpha
          path: output
      - name: Publish reviewed alpha artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp output/app/build/outputs/apk/debug/app-debug.apk release/putnik-alpha.apk
          cp output/evidence/verification.json release/verification.json
          cp output/evidence/native/llm-smoke.json release/llm-smoke.json
          (cd release && sha256sum putnik-alpha.apk > SHA256SUMS)
          (cd output/evidence/screenshots && zip -r ../../../release/android-emulator-screenshots.zip .)
          gh release create "alpha-${{ github.run_number }}" release/* --prerelease --target "$GITHUB_SHA" --title "Путник · Android alpha ${{ github.run_number }}" --notes-file docs/ALPHA.md
